# Conexiones locales sin SSL
local   all             all                                     scram-sha-256
# Conexiones localhost IPv4 con SSL obligatorio
hostssl all             all             127.0.0.1/32            scram-sha-256
# Rechazar conexiones IPv4 sin SSL
hostnossl all           all             127.0.0.1/32            reject
# Conexiones localhost IPv6 con SSL obligatorio
hostssl all             all             ::1/128                 scram-sha-256
# Rechazar conexiones IPv6 sin SSL
hostnossl all           all             ::1/128                 reject
# Permitir conexiones desde cualquier IP con SSL
hostssl all             all             0.0.0.0/0               scram-sha-256
# Rechazar conexiones sin SSL
hostnossl all           all             0.0.0.0/0               reject