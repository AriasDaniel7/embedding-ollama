services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs
    ports:
      - "3000:3000"
    volumes:
      - "./src:/app/src"
      - "certs:/app/pg_certs"
    environment:
      - PORT=${PORT:-3000}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=${POSTGRES_PORT}
      - API_OLLAMA=http://ollama:11434
    depends_on:
      - postgresql
      - ollama
    networks:
      - embedded

  postgresql:
    build:
      context: ./postgresql_config
      dockerfile: Dockerfile
    restart: always
    container_name: postgresql
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - certs:/certs
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - embedded

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - embedded
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

networks:
  embedded:
    driver: bridge

volumes:
  certs:
    driver: local
